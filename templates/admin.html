<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Upload Study Material</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-xl mx-auto mt-12 bg-white p-8 rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-cloud-arrow-up mr-2 text-indigo-600"></i> Upload Material</h1>
            <a href="/" class="text-indigo-600 font-semibold hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Site</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'success' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Material Title</label>
                <input type="text" name="title" required placeholder="e.g. Class 10 Ch 1 Real Numbers Notes" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Board</label>
                    <select name="board" class="w-full border p-2.5 rounded-lg">
                        <option value="CBSE">CBSE</option>
                        <option value="GSEB">GSEB</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Class</label>
                    <select name="class" class="w-full border p-2.5 rounded-lg">
                        <option value="Class 6">Class 6</option>
                        <option value="Class 7">Class 7</option>
                        <option value="Class 8">Class 8</option>
                        <option value="Class 9">Class 9</option>
                        <option value="Class 10">Class 10</option>
                        <option value="Class 11">Class 11</option>
                        <option value="Class 12">Class 12</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Subject</label>
                    <select name="subject" class="w-full border p-2.5 rounded-lg">
                        <option value="Mathematics">Mathematics</option>
                        <option value="Science">Science</option>
                        <option value="English">English</option>
                        <option value="Social Science">Social Science</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Gujarati">Gujarati</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Resource Type</label>
                    <select name="type" class="w-full border p-2.5 rounded-lg">
                        <option value="Textbook">Textbook</option>
                        <option value="Notes">Notes</option>
                        <option value="Solutions">Solutions</option>
                        <option value="Sample Paper">Sample Paper</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Upload File (PDF/DOCX)</label>
                <input type="file" name="file" required class="w-full border p-2 rounded-lg bg-gray-50">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">
                Publish Material
            </button>
        </form>
    </div>
</body>
</html>
